<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lost in Los Santos — CnC</title>
  <meta name="robots" content="noindex">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07060f; color: #eeedfb; font: 400 1rem/1.6 system-ui, 'Segoe UI', sans-serif; text-align: center; padding: 24px;
      background-image: radial-gradient(700px 400px at 20% 0%, rgba(77,141,255,.16), transparent 60%), radial-gradient(700px 400px at 80% 100%, rgba(255,71,102,.14), transparent 60%); }
    h1 { font-size: clamp(3rem, 10vw, 6rem); margin: 0; letter-spacing: .06em; background: linear-gradient(100deg, #4d8dff, #8b5cf6, #ff4766); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { color: #a9a7c8; max-width: 420px; margin: 8px auto 26px; }
    a { display: inline-block; padding: 14px 26px; border-radius: 12px; background: linear-gradient(100deg, #4d8dff, #8b5cf6, #ff4766); color: #fff; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>This street isn't on the map. Lena would know the way &mdash; so does this button.</p>
    <a id="home" href="/">Back to the city</a>
  </main>
  <script>
    // GitHub Pages serves this page at any missing path. On a project site (user.github.io/cnc-website/...) home is the first folder.
    if (location.hostname.endsWith('github.io')) document.getElementById('home').href = '/' + location.pathname.split('/')[1] + '/';
  </script>
</body>
</html>
